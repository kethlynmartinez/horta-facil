<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro | Horta Fácil</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style-login.css">
</head>

<body class="page-login">

<main class="login-wrapper">

  <div class="login-header">
    <img src="src/logo/logo.png" alt="Logotipo Horta Fácil" class="login-header__logo">
    <h1 class="login-header__title">Horta Fácil</h1>
    <p class="login-header__subtitle">Crie sua conta gratuita e comece a plantar!</p>
  </div>

  <div class="login-card">

    <div class="login-tabs">
      <a href="login.html" class="login-tabs__tab">Entrar</a>
      <a href="#" class="login-tabs__tab login-tabs__tab--active">Criar conta</a>
    </div>

    <form id="formCadastro" class="login-form">

      <div class="form-group">
        <label for="nome" class="form-group__label">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required class="form-group__input">
      </div>

      <div class="form-group">
        <label for="username" class="form-group__label">Nome de usuário</label>
        <input type="text" id="username" name="username" placeholder="seu.usuario" required class="form-group__input">
      </div>

      <div class="form-group">
        <label for="email" class="form-group__label">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required class="form-group__input">
      </div>

      <div class="form-group">
        <label for="senha" class="form-group__label">Senha (mín. 6 caracteres)</label>
        <input type="password" id="senha" name="senha" placeholder="••••••" required class="form-group__input">
      </div>

      <div class="form-group">
        <label for="confirmar-senha" class="form-group__label">Confirme a senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="••••••" required class="form-group__input">
      </div>

      <button type="submit" class="btn--full">
        Cadastrar
      </button>

    </form>
  </div>

  <a href="index.html" class="link--home">
    ← Voltar para o início
  </a>

</main>
<script src="js/mock-auth.js"></script>
<script src="js/cadastro.js"></script>

</body>
</html>
