<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Senha | Horta Fácil</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style-login.css?v=6">
  <link rel="stylesheet" href="css/toast.css?v=6"> 
</head>
<body class="page-login">

<main class="login-wrapper">
    <div class="login-header">
        <h1 class="login-header__Recuperar">Recuperar Senha</h1>
        <p class="login-header__subtitle">Informe seu e-mail para receber as instruções.</p>
    </div>
    <div class="login-card">
        <form id="formRecuperarSenha" class="login-form">
            <div class="form-group">
                <label for="email" class="form-group__label">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required class="form-group__input">
            </div>
            <button type="submit" class="btn--full"> Enviar Instruções </button>
        </form>
    </div>
    <a href="login.html" class="link--home">← Voltar para o login</a>
</main>

<script src="js/toast.js?v=6"></script>
<script src="js/recuperar-senha.js?v=6"></script>

</body>
</html>
